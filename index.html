<!DOCTYPE html>
<html lang="ko" dir="ltr">
<head>
<meta charset="UTF-8">

<title>개인정보 처리방침 | MewgicPixel</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100%; }
  body {
    background:#ffffff;
    color:#1b2733;
    font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:860px; margin:0 auto; padding:36px 20px 56px; }
  header { text-align:center; margin-bottom:24px; }
  .kicker { font-size:12px; letter-spacing:4px; color:#2f6f9e; margin-bottom:10px; }
  h1 { margin:0; font-size:clamp(26px,5vw,40px); color:#102a43; }
  .langbar { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin:22px 0 28px; }
  .langbar label { font-size:14px; color:#4a5b6b; }
  .lang-select {
    background:#ffffff; color:#102a43; border:1px solid #b8c6d4; border-radius:6px;
    padding:10px 14px; font-size:15px; min-height:44px; cursor:pointer;
  }
  main {
    background:#ffffff; border:1px solid #d8e2ec;
    border-radius:18px; padding:clamp(20px,4vw,36px);
    box-shadow:0 12px 32px rgba(15,40,70,.08);
  }
  section { margin-bottom:26px; }
  section:last-of-type { margin-bottom:18px; }
  h2 { margin:0 0 8px; font-size:clamp(19px,3vw,23px); color:#1f5f8b; }
  p { margin:0; font-size:clamp(15px,2.6vw,17px); color:#2d3e50; }
  .updated { display:inline-block; font-size:14px; color:#5b6b7b; }
  .note { margin-top:22px; padding-top:16px; border-top:1px solid #d8e2ec; font-size:13px; color:#5b6b7b; }
  footer { text-align:center; margin-top:26px; font-size:13px; color:#5b6b7b; }
  html[dir="rtl"] .kicker, html[dir="rtl"] footer { letter-spacing:normal; }
  @media (max-width:600px) {
    .wrap { padding:24px 14px 40px; }
    main { padding:20px 16px; }
    p { font-size:16px; }
    section { margin-bottom:22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker" id="sub">PRIVACY POLICY</div>
    <h1 id="title">개인정보 처리방침</h1>
  </header>

  <div class="langbar">
    <label for="langSelect">언어 / Language</label>
    <select class="lang-select" id="langSelect">
      <option value="auto">AUTO</option>
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="zh">中文</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>

      <option value="ru">Русский</option>
      <option value="ar">العربية</option>
    </select>
  </div>

  <main>
    <section><h2 id="collected"></h2><p id="collectedBody"></p></section>
    <section><h2 id="purpose"></h2><p id="purposeBody"></p></section>
    <section><h2 id="local"></h2><p id="localBody"></p></section>
    <section><h2 id="retention"></h2><p id="retentionBody"></p></section>
    <section><h2 id="ads"></h2><p id="adsBody"></p></section>
    <section><h2 id="thirdParty"></h2><p id="thirdPartyBody"></p></section>
    <section><h2 id="global"></h2><p id="globalBody"></p></section>
    <section><h2 id="withdraw"></h2><p id="withdrawBody"></p></section>
    <section><h2 id="rights"></h2><p id="rightsBody"></p></section>
    <section><h2 id="security"></h2><p id="securityBody"></p></section>
    <section><h2 id="children"></h2><p id="childrenBody"></p></section>
    <section><h2 id="changes"></h2><p id="changesBody"></p></section>
    <section><h2 id="contact"></h2><p id="contactBody"></p></section>
    <div class="updated" id="updated"></div>
    <p class="note">게임 내 옵션(OPTIONS) → PRIVACY POLICY에서도 동일한 내용을 확인할 수 있습니다.<br>The same policy is available in-game via OPTIONS → PRIVACY POLICY.</p>
  </main>

  <footer>© 2026 MewgicPixel. All rights reserved.</footer>
</div>

    purpose:'Finalidad del uso', purposeBody:'El apodo y la puntuación se usan únicamente para crear la clasificación local y comparar tu mejor resultado en este dispositivo. Los datos relacionados con anuncios son tratados por Google AdMob para mostrar y medir anuncios.',
    local:'Almacenamiento local', localBody:'La configuración del juego (efectos de sonido, música, idioma), los créditos, los personajes desbloqueados y seleccionados, las entradas de la clasificación local y la mejor puntuación se guardan en el navegador de este dispositivo (localStorage). Nunca se suben a un servidor externo.',
    retention:'Plazo de conservación', retentionBody:'La clasificación local, el apodo, la mejor puntuación y la configuración permanecen en este dispositivo hasta que pulsas BORRAR REGISTROS en la pantalla de clasificación o borras los datos del navegador/de la app. No guardamos una copia separada en un servidor del desarrollador. La conservación de datos publicitarios sigue la política de Google AdMob.',
    ads:'Publicidad', adsBody:'La versión APK muestra anuncios reales de Google AdMob con los ID configurados, mientras que la versión web muestra anuncios de demostración. Para mostrar y medir anuncios pueden procesarse identificadores publicitarios, ubicación aproximada derivada de IP e interacciones de la app como impresiones y clics.',
    thirdParty:'Compartir con terceros', thirdPartyBody:'La información publicitaria anterior puede compartirse con Google AdMob para la entrega de anuncios. Los apodos y puntuaciones de la clasificación no se envían a ningún servidor ni se comparten con terceros. No vendemos ni alquilamos información personal.',
    global:'Almacenamiento de clasificación', globalBody:'Las clasificaciones no se envían a ningún servidor; se guardan solo en el navegador de este dispositivo (localStorage). La sincronización con Firebase está desactivada, por lo que incluso la pestaña «Global» muestra solo los registros guardados en el dispositivo.',
    withdraw:'Borrar registros', withdrawBody:'Al pulsar BORRAR REGISTROS en la pantalla de clasificación se eliminan al instante la lista local (js_rank_local), el apodo guardado (js_nick) y la mejor puntuación (js_best), y esta vuelve a 0. También puedes borrar todos los datos limpiando la caché o los datos del sitio/de la app.',
    rights:'Tus derechos', rightsBody:'Puedes borrar tus registros locales en cualquier momento con el botón anterior. Si tienes preguntas sobre la recopilación o eliminación, escríbenos a los datos de contacto siguientes y te responderemos tras revisarlos.',
    security:'Seguridad', securityBody:'Los datos de clasificación y los apodos se guardan en este dispositivo, no en un servidor. Si compartes el dispositivo o no borras los datos del navegador, otras personas podrían ver los registros guardados; usa la función de borrado cuando lo necesites.',
    children:'Edad objetivo', childrenBody:'Este juego está dirigido a usuarios de 16 años o más. No recopilamos deliberadamente información personal de menores de 16 años. Los menores de 16 no deben introducir un apodo sin el permiso de su tutor.',
    changes:'Cambios en la política', changesBody:'Esta política puede actualizarse cuando cambie el juego, las políticas publicitarias o los requisitos legales. Actualizaremos la fecha de última modificación y mostraremos la versión más reciente en esta página y en la pantalla de privacidad del juego.',
    contact:'Contacto', contactBody:'Desarrollador: MewgicPixel / Teléfono: 010-2947-5602 / Correo: junstar508@gmail.com / Para consultas sobre privacidad, usa el teléfono o correo anteriores.',
    updated:'Última actualización: noviembre de 2026',
  },
  fr: {
    title:'Politique de confidentialité', sub:'PRIVACY POLICY',
    collected:'Informations collectées', collectedBody:'Ce jeu demande uniquement le pseudo que vous saisissez vous-même pour le classement et le conserve sur cet appareil. Nous ne demandons ni votre nom, ni votre adresse e-mail, ni votre numéro de téléphone, ni votre position précise, ni toute autre information identifiable, et nous ne les envoyons pas à un serveur du développeur.',
    purpose:'Finalité de l’utilisation', purposeBody:'Le pseudo et le score servent uniquement à créer le classement local et à comparer votre meilleur résultat sur cet appareil. Les données liées aux publicités sont traitées par Google AdMob pour diffuser et mesurer les annonces.',
    local:'Stockage local', localBody:'Les paramètres du jeu (effets sonores, musique, langue), les crédits, les personnages débloqués et sélectionnés, les entrées du classement local et le meilleur score sont enregistrés dans le navigateur de cet appareil (localStorage). Ils ne sont jamais envoyés à un serveur externe.',
    retention:'Durée de conservation', retentionBody:'Le classement local, le pseudo, le meilleur score et les paramètres restent sur cet appareil jusqu’à ce que vous appuyiez sur SUPPRIMER dans l’écran de classement ou effaciez les données du navigateur/de l’application. Nous ne conservons pas de copie séparée sur un serveur du développeur. La conservation des données publicitaires suit la politique de Google AdMob.',
    ads:'Publicité', adsBody:'La version APK affiche de vraies publicités Google AdMob avec les identifiants configurés, tandis que la version navigateur affiche des publicités de démonstration. Des identifiants publicitaires, une position approximative déduite de l’IP et des interactions avec l’application (impressions, clics) peuvent être traités pour diffuser et mesurer les annonces.',
    thirdParty:'Partage avec des tiers', thirdPartyBody:'Les informations publicitaires ci-dessus peuvent être partagées avec Google AdMob pour la diffusion d’annonces. Les pseudos et scores du classement ne sont envoyés à aucun serveur et ne sont pas partagés avec des tiers. Nous ne vendons ni ne louons d’informations personnelles.',
    global:'Stockage du classement', globalBody:'Les classements ne sont pas envoyés à un serveur ; ils sont enregistrés uniquement dans le navigateur de cet appareil (localStorage). La synchronisation Firebase est actuellement désactivée : même l’onglet « Global » n’affiche que les enregistrements stockés sur l’appareil.',
    withdraw:'Suppression des enregistrements', withdrawBody:'Appuyer sur SUPPRIMER dans l’écran de classement efface immédiatement la liste locale (js_rank_local), le pseudo enregistré (js_nick) et le meilleur score (js_best), qui repasse à 0. Vous pouvez aussi supprimer toutes les données en effaçant le cache ou les données du site/de l’application.',
    rights:'Vos droits', rightsBody:'Vous pouvez supprimer vos enregistrements locaux à tout moment avec le bouton ci-dessus. Pour toute question sur la collecte ou la suppression, contactez-nous aux coordonnées ci-dessous ; nous vérifierons et vous répondrons.',
    security:'Sécurité', securityBody:'Les données de classement et les pseudos sont stockés sur cet appareil, pas sur un serveur. Si vous partagez l’appareil ou n’effacez pas les données du navigateur, d’autres personnes pourraient voir les enregistrements. Utilisez la fonction de suppression si nécessaire.',
    children:'Âge cible', childrenBody:'Ce jeu est destiné aux utilisateurs âgés de 16 ans et plus. Nous ne collectons pas volontairement de données personnelles concernant les moins de 16 ans. Les moins de 16 ans ne doivent pas saisir de pseudo sans l’autorisation d’un tuteur.',
    changes:'Modifications de la politique', changesBody:'Cette politique peut être modifiée lors de mises à jour du jeu, de changements de politique publicitaire ou d’exigences légales. Nous mettrons à jour la date de dernière modification et afficherons la version la plus récente sur cette page et dans l’écran de confidentialité du jeu.',
    contact:'Contact', contactBody:'Développeur : MewgicPixel / Téléphone : 010-2947-5602 / E-mail : junstar508@gmail.com / Pour toute question de confidentialité, utilisez le numéro ou l’e-mail ci-dessus.',
    updated:'Dernière mise à jour : novembre 2026',
  },
  de: {
    title:'Datenschutzerklärung', sub:'PRIVACY POLICY',
    collected:'Erhobene Daten', collectedBody:'Dieses Spiel fragt nur den von dir selbst eingegebenen Spitznamen für die Rangliste ab und speichert ihn auf diesem Gerät. Wir fragen weder Namen, E-Mail-Adresse, Telefonnummer, genauen Standort noch andere identifizierende Daten ab und senden sie nicht an einen Entwicklerserver.',
    purpose:'Zweck der Nutzung', purposeBody:'Spitzname und Punktzahl werden nur verwendet, um auf diesem Gerät eine lokale Rangliste zu erstellen und dein Bestergebnis zu vergleichen. Werbebezogene Daten werden von Google AdMob verarbeitet, um Anzeigen auszuliefern und zu messen.',
    local:'Lokale Speicherung', localBody:'Spieleinstellungen (Soundeffekte, Musik, Sprache), Guthaben, freigeschaltete und ausgewählte Charaktere, lokale Ranglisteneinträge und der Bestwert werden im Browser dieses Geräts (localStorage) gespeichert. Sie werden nie an einen externen Server hochgeladen.',
    retention:'Aufbewahrungsdauer', retentionBody:'Lokale Rangliste, Spitzname, Bestwert und Einstellungen bleiben auf diesem Gerät, bis du im Ranglistenbildschirm DATEN LÖSCHEN antippen oder die Browser-/App-Daten löschst. Wir bewahren keine separate Kopie auf einem Entwicklerserver auf. Die Aufbewahrung Werbedaten richtet sich nach der Google-AdMob-Richtlinie.',
    ads:'Werbung', adsBody:'Die APK-Version zeigt echte Google-AdMob-Werbung mit den konfigurierten IDs an, die Browser-Version zeigt Demo-Werbung. Für Auslieferung und Messung von Werbung können Werbe-IDs, aus der IP abgeleitete ungefähre Standorte und App-Interaktionen wie Impressionen und Klicks verarbeitet werden.',
    thirdParty:'Weitergabe an Dritte', thirdPartyBody:'Die oben genannten Werbedaten können zur Anzeigenauslieferung mit Google AdMob geteilt werden. Ranglisten-Spitznamen und Punktzahlen werden an keinen Server gesendet und nicht mit Dritten geteilt. Wir verkaufen oder vermieten keine personenbezogenen Daten.',
    global:'Ranglisten-Speicherung', globalBody:'Ranglisten werden nicht an einen Server gesendet; sie werden nur im Browser dieses Geräts (localStorage) gespeichert. Die Firebase-Synchronisierung ist derzeit deaktiviert, daher zeigt selbst der Reiter „Global“ nur auf dem Gerät gespeicherte Einträge.',
    withdraw:'Einträge löschen', withdrawBody:'Wenn du im Ranglistenbildschirm DATEN LÖSCHEN antippst, werden die lokale Liste (js_rank_local), der gespeicherte Spitzname (js_nick) und der Bestwert (js_best) sofort gelöscht und der Bestwert auf 0 zurückgesetzt. Alle Spieldaten kannst du auch durch Löschen des Browser-Caches, der Websitedaten oder der App-Daten entfernen.',
    rights:'Deine Rechte', rightsBody:'Du kannst deine lokalen Einträge jederzeit mit der obigen Schaltfläche selbst löschen. Bei Fragen zur Erhebung oder Löschung schreibe uns über die unten genannten Kontaktdaten; wir prüfen die Anfrage und antworten.',
    security:'Sicherheit', securityBody:'Ranglistendaten und Spitznamen werden auf diesem Gerät und nicht auf einem Server gespeichert. Wenn du das Gerät mit anderen teilst oder die Browserdaten nicht löschst, können gespeicherte Einträge sichtbar sein. Nutze bei Bedarf die Löschfunktion.',
    children:'Zielalter', childrenBody:'Dieses Spiel ist für Nutzer ab 16 Jahren vorgesehen. Wir erheben nicht absichtlich personenbezogene Daten von unter 16-Jährigen. Nutzer unter 16 sollten ohne Erlaubnis einer Aufsichtsperson keinen Spitznamen eingeben.',
    changes:'Änderungen der Richtlinie', changesBody:'Diese Richtlinie kann bei Spielupdates, Änderungen der Werberichtlinien oder gesetzlichen Anforderungen aktualisiert werden. Wir aktualisieren dann das Datum der letzten Änderung und zeigen die neueste Version auf dieser Seite und im Datenschutzbildschirm des Spiels.',
    contact:'Kontakt', contactBody:'Entwickler: MewgicPixel / Telefon: 010-2947-5602 / E-Mail: junstar508@gmail.com / Bei Datenschutzfragen nutze bitte die oben genannte Telefonnummer oder E-Mail-Adresse.',
    updated:'Letzte Aktualisierung: November 2026',
  },
  pt: {
    title:'Política de privacidade', sub:'PRIVACY POLICY',
    collected:'Dados coletados', collectedBody:'Este jogo solicita apenas o apelido que você mesmo informa para o ranking e o armazena neste dispositivo. Não pedimos seu nome, e-mail, telefone, localização precisa nem qualquer outra informação identificável, e não enviamos nada a um servidor do desenvolvedor.',
    purpose:'Finalidade do uso', purposeBody:'O apelido e a pontuação são usados apenas para criar o ranking local e comparar seu melhor resultado neste dispositivo. Os dados relacionados a anúncios são tratados pelo Google AdMob para exibir e medir anúncios.',
    local:'Armazenamento local', localBody:'Configurações do jogo (efeitos sonoros, música, idioma), créditos, personagens desbloqueados e selecionados, entradas do ranking local e a melhor pontuação ficam no navegador deste dispositivo (localStorage). Nunca são enviados a um servidor externo.',
    retention:'Período de retenção', retentionBody:'O ranking local, o apelido, a melhor pontuação e as configurações permanecem neste dispositivo até você tocar em EXCLUIR REGISTROS na tela de ranking ou apagar os dados do navegador/do aplicativo. Não mantemos uma cópia separada em servidor do desenvolvedor. A retenção de dados de anúncios segue a política do Google AdMob.',
    ads:'Publicidade', adsBody:'A versão APK exibe anúncios reais do Google AdMob com os IDs configurados, enquanto a versão navegador exibe anúncios de demonstração. Identificadores de publicidade, localização aproximada derivada de IP e interações do aplicativo como impressões e cliques podem ser processados para exibir e medir anúncios.',
    thirdParty:'Compartilhamento com terceiros', thirdPartyBody:'As informações publicitárias acima podem ser compartilhadas com o Google AdMob para entrega de anúncios. Apelidos e pontuações do ranking não são enviados a servidores nem compartilhados com terceiros. Não vendemos nem alugamos informações pessoais.',
    global:'Armazenamento do ranking', globalBody:'Os rankings não são enviados a um servidor; ficam apenas no navegador deste dispositivo (localStorage). A sincronização com o Firebase está desativada, então até a aba “Global” mostra apenas registros armazenados no dispositivo.',
    withdraw:'Excluir registros', withdrawBody:'Ao tocar em EXCLUIR REGISTROS na tela de ranking, a lista local (js_rank_local), o apelido salvo (js_nick) e a melhor pontuação (js_best) são removidos imediatamente, e a melhor pontuação volta a 0. Você também pode remover todos os dados limpando o cache/dados do site ou os dados do aplicativo.',
    rights:'Seus direitos', rightsBody:'Você pode excluir seus registros locais a qualquer momento usando o botão acima. Para dúvidas sobre coleta ou exclusão, entre em contato pelos dados abaixo; revisaremos e responderemos.',
    security:'Segurança', securityBody:'Dados de ranking e apelidos ficam neste dispositivo, não em um servidor. Se você compartilhar o dispositivo ou não limpar os dados do navegador, outras pessoas poderão ver os registros salvos. Use a função de exclusão quando necessário.',
    children:'Idade recomendada', childrenBody:'Este jogo é destinado a usuários com 16 anos ou mais. Não coletamos intencionalmente dados pessoais de menores de 16 anos. Usuários com menos de 16 anos não devem informar um apelido sem permissão de um responsável.',
    changes:'Alterações da política', changesBody:'Esta política pode ser atualizada quando o jogo muda, as políticas de anúncios mudam ou há novas exigências legais. Atualizaremos a data da última alteração e mostraremos a versão mais recente nesta página e na tela de privacidade do jogo.',
    contact:'Contato', contactBody:'Desenvolvedor: MewgicPixel / Telefone: 010-2947-5602 / E-mail: junstar508@gmail.com / Para questões de privacidade, use o telefone ou e-mail acima.',
    updated:'Última atualização: novembro de 2026',
  },
  ru: {
    title:'Политика конфиденциальности', sub:'PRIVACY POLICY',
    collected:'Собираемые данные', collectedBody:'Игра запрашивает только никнейм, который вы вводите сами для рейтинга, и сохраняет его на этом устройстве. Мы не запрашиваем имя, адрес электронной почты, телефон, точное местоположение или другие идентифицирующие данные и не отправляем их на сервер разработчика.',
    purpose:'Цель использования', purposeBody:'Никнейм и результат используются только для создания локального рейтинга и сравнения вашего лучшего результата на этом устройстве. Данные, связанные с рекламой, обрабатываются Google AdMob для показа и оценки объявлений.',
    local:'Локальное хранение', localBody:'Настройки игры (звуковые эффекты, музыка, язык), кредиты, разблокированные и выбранные персонажи, записи локального рейтинга и лучший результат хранятся в браузере этого устройства (localStorage). Они никогда не загружаются на внешний сервер.',
    retention:'Срок хранения', retentionBody:'Локальный рейтинг, никнейм, лучший результат и настройки остаются на этом устройстве, пока вы не нажмёте УДАЛИТЬ ЗАПИСИ на экране рейтинга или не очистите данные браузера/приложения. Отдельной копии на сервере разработчика мы не храним. Срок хранения рекламных данных определяется политикой Google AdMob.',
    ads:'Реклама', adsBody:'APK-версия показывает реальную рекламу Google AdMob с настроенными идентификаторами, а веб-версия — демонстрационную рекламу. Для показа и оценки объявлений могут обрабатываться рекламные идентификаторы, примерное местоположение на основе IP и взаимодействия с приложением, такие как показы и клики.',
    thirdParty:'Передача третьим лицам', thirdPartyBody:'Указанные выше рекламные данные могут передаваться Google AdMob для показа объявлений. Никнеймы и результаты рейтинга не отправляются на сервер и не передаются третьим лицам. Мы не продаём и не сдаём личные данные в аренду.',
    global:'Хранение рейтинга', globalBody:'Рейтинг не отправляется на сервер и хранится только в браузере этого устройства (localStorage). Синхронизация с Firebase сейчас отключена, поэтому даже вкладка «Глобальный» показывает только записи, сохранённые на устройстве.',
    withdraw:'Удаление записей', withdrawBody:'Нажатие УДАЛИТЬ ЗАПИСИ на экране рейтинга немедленно удаляет локальный список (js_rank_local), сохранённый никнейм (js_nick) и лучший результат (js_best), после чего лучший результат сбрасывается до 0. Все данные игры можно удалить через очистку кэша/данных сайта или данных приложения.',
    rights:'Ваши права', rightsBody:'Вы можете удалить свои локальные записи в любое время с помощью кнопки выше. По вопросам сбора или удаления данных напишите нам по контактным данным ниже: мы проверим запрос и ответим.',
    security:'Безопасность', securityBody:'Данные рейтинга и никнеймы хранятся на этом устройстве, а не на сервере. Если вы делитесь устройством с другими или не очищаете данные браузера, сохранённые записи могут быть видны. При необходимости пользуйтесь функцией удаления.',
    children:'Возрастная группа', childrenBody:'Игра предназначена для пользователей от 16 лет. Мы не собираем личные данные лиц младше 16 лет намеренно. Пользователям младше 16 лет не следует вводить никнейм без разрешения опекуна.',
    changes:'Изменения политики', changesBody:'Эта политика может обновляться при изменениях игры, рекламной политики или правовых требований. Мы обновим дату последнего изменения и покажем актуальную версию на этой странице и на экране конфиденциальности в игре.',
    contact:'Контакты', contactBody:'Разработчик: MewgicPixel / Телефон: 010-2947-5602 / Эл. почта: junstar508@gmail.com / По вопросам конфиденциальности используйте указанный телефон или адрес электронной почты.',
    updated:'Обновлено: ноябрь 2026',
  },
  ar: {
    title:'سياسة الخصوصية', sub:'PRIVACY POLICY',
    collected:'المعلومات التي نجمعها', collectedBody:'تطلب هذه اللعبة فقط الاسم المستعار الذي تدخله بنفسك للترتيب، وتحفظه على هذا الجهاز. لا نطلب اسمك أو بريدك الإلكتروني أو رقم هاتفك أو موقعك الدقيق أو أي معلومات أخرى يمكن تحديدها، ولا نرسلها إلى خادم المطوّر.',
    purpose:'غرض الاستخدام', purposeBody:'يُستخدم الاسم المستعار والنتيجة فقط لإنشاء ترتيب محلي على هذا الجهاز ومقارنة أفضل نتيجة لديك. تتولى Google AdMob معالجة البيانات المتعلقة بالإعلانات لعرضها وقياسها.',
    local:'التخزين المحلي', localBody:'تُحفظ إعدادات اللعبة (المؤثرات الصوتية، الموسيقى، اللغة) والرصيد والشخصيات المفتوحة والمختارة وإدخالات الترتيب المحلي وأفضل نتيجة في متصفح هذا الجهاز (localStorage). لا تُرفع هذه البيانات إلى أي خادم خارجي.',
    retention:'مدة الاحتفاظ', retentionBody:'يبقى الترتيب المحلي والاسم المستعار وأفضل نتيجة والإعدادات على هذا الجهاز حتى تضغط زر حذف السجلات في شاشة الترتيب أو تمسح بيانات المتصفح/التطبيق. لا نحتفظ بنسخة منفصلة على خادم المطوّر. تتبع مدة الاحتفاظ ببيانات الإعلانات سياسة Google AdMob.',
    ads:'الإعلانات', adsBody:'تعرض نسخة APK إعلانات حقيقية من Google AdMob باستخدام معرفات مُعدّة، بينما تعرض نسخة المتصفح إعلانات تجريبية. قد تُعالج معرفات الإعلانات والموقع التقريبي المستنتج من IP وتفاعلات التطبيق مثل ظهور الإعلانات والنقرات لعرض الإعلانات وقياسها.',
    thirdParty:'المشاركة مع أطراف ثالثة', thirdPartyBody:'قد تُشارك معلومات الإعلانات المذكورة أعلاه مع Google AdMob لتقديم الإعلانات. لا تُرسل أسماء الترتيب ونتائجه إلى أي خادم ولا تُشارك مع أطراف ثالثة. لا نبيع المعلومات الشخصية أو نؤجرها.',

const SUPPORTED = Object.keys(PRIVACY_I18N);
const KEYS = ['title','sub','collected','collectedBody','purpose','purposeBody','local','localBody','retention','retentionBody','ads','adsBody','thirdParty','thirdPartyBody','global','globalBody','withdraw','withdrawBody','rights','rightsBody','security','securityBody','children','childrenBody','changes','changesBody','contact','contactBody','updated'];

function detectLang(){
  const n = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').slice(0,2).toLowerCase();
  return SUPPORTED.indexOf(n) !== -1 ? n : 'en';
}
let savedLang = 'auto';
try { savedLang = localStorage.getItem('js_lang') || 'auto'; } catch(e) {}

function render(){
  const code = savedLang === 'auto' ? detectLang() : savedLang;
  const d = PRIVACY_I18N[code] || PRIVACY_I18N.en;
  document.documentElement.lang = code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = d.title + ' | MewgicPixel';
  KEYS.forEach(k => {
    const el = document.getElementById(k);
    if (el) el.textContent = d[k];
  });
  document.getElementById('langSelect').value = savedLang;
}
document.getElementById('langSelect').addEventListener('change', function(){
  savedLang = this.value;
  try { localStorage.setItem('js_lang', savedLang); } catch(e) {}
  render();
});
render();
</script>
