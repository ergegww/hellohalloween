const SUPPORTED = Object.keys(PRIVACY_I18N);
const KEYS = ['title','sub','collected','collectedBody','local','localBody','ads','adsBody','global','globalBody','withdraw','withdrawBody','children','childrenBody','contact','contactBody','updated'];

function detectLang(){
  const n = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').slice(0,2).toLowerCase();
  return SUPPORTED.indexOf(n) !== -1 ? n : 'en';
}
let savedLang = 'auto';
try { savedLang = localStorage.getItem('js_lang') || 'auto'; } catch(e) {}

function render(){
  const code = savedLang === 'auto' ? detectLang() : savedLang;
  const d = PRIVACY_I18N[code] || PRIVACY_I18N.en;
  document.documentElement.lang = code;
  document.documentElement.dir = (code === 'ar') ? 'rtl' : 'ltr';
  document.title = d.title + ' | MewgicPixel';
  KEYS.forEach(k => {
    const el = document.getElementById(k);
    if (el) el.textContent = d[k];
  });
  document.getElementById('langSelect').value = savedLang;
}
document.getElementById('langSelect').addEventListener('change', function(){
  savedLang = this.value;
  try { localStorage.setItem('js_lang', savedLang); } catch(e) {}
  render();
});
render();
